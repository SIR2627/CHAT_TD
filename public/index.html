<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1> Minimal Chat App SIR 2627 </h1>
    <div id="chat">
        <input type="text" id="message" placeholder="escreva a sua mensagem">
        <button id="sendB">Enviar</button>
    </div>
    <div id="messageBoard">

    </div>
    
</body>
<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();

    const messageBoard = document.getElementById('messageBoard');
    const sendButton = document.getElementById('sendB');
    const messageInput = document.getElementById('message');
    
    sendButton.addEventListener('click', () => {
        const message = messageInput.value;
        socket.emit('mensagem', message);
        messageInput.value = '';
    });

    socket.on('msgpost', (msg) => {
        console.log('mensagem recebida do servidor:', msg);
        const messageElement = document.createElement('p');
        messageElement.style.color = msg.color;
        messageElement.textContent = msg.msg;
        messageBoard.appendChild(messageElement);
    });

</script>
</html>
